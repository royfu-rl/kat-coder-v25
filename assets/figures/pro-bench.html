<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAT Coder Pro V2.5 — grouped bars</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ink:#1a1a1a;--muted:#9a9aa0;--muted2:#b8b8be;--border:#e6e6e6;
    --accent:#489034;--accent-deep:#163f17;  /* KAT Coder V2.5: Vitality Green → Ink Core Green */
  }
  *{box-sizing:border-box;}
  body{margin:0;background:transparent;font-family:var(--font);color:var(--ink);
    -webkit-font-smoothing:antialiased;padding:4px 2px;display:flex;justify-content:center;}
  .card{background:transparent;border:none;border-radius:0;padding:0;
    width:100%;max-width:1340px;box-shadow:none;}
  .title{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.3;max-width:760px;}
  .subtitle{font-size:13.5px;color:var(--muted);margin:7px 0 0;line-height:1.5;max-width:760px;}
  /* 6 panels: keep the rows balanced (3+3, then 2+2+2, then stacked) */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:0;}
  @media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:620px){.grid{grid-template-columns:1fr;}}
  .panel{min-width:0;background:#fafafb;border:1px solid var(--border);
    border-radius:12px;padding:12px 12px 6px;}
  .panel-name{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.3;}
  .panel-dom{font-size:11px;font-weight:500;color:var(--muted2);margin-left:5px;}
  .note{font-size:13px;color:var(--muted);margin:20px 0 0;line-height:1.5;max-width:760px;}
  svg text{font-family:var(--font);}
  .blogo{fill:#1a1a1a;opacity:.78;}                /* default for monochrome logos; slightly muted on grey bars */
  .bar-hl .blogo{opacity:1;}
  .bar-hl .blogo,.bar-hl .blogo path{fill:#fff;}   /* repaint logo white on the highlighted (green) bar */
  .barrect{transition:y .5s cubic-bezier(.22,.61,.36,1),height .5s cubic-bezier(.22,.61,.36,1);}
  .grp{cursor:default;}
  .grp:hover .barrect{filter:brightness(1.05);}
  @media (prefers-reduced-motion:reduce){.barrect{transition:none;}}
  #tip{position:fixed;z-index:50;pointer-events:none;background:#111;color:#fff;border-radius:8px;
    padding:8px 11px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25);
    opacity:0;transition:opacity .12s;white-space:nowrap;}
  #tip .t-cat{font-weight:600;margin-bottom:2px;} #tip b{color:#fff;} #tip .t-dim{color:#cfcfd4;}
</style>
</head>
<body>
<div class="card">
  <h2 class="title" id="title"></h2>
  <p class="subtitle" id="subtitle"></p>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
</div>
<div id="tip"></div>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  DATA — edit this block only.                                ║
   ╚══════════════════════════════════════════════════════════════╝
   6 benchmark panels in a 2×3 grid, one card on a white shell. Within a panel,
   one bar per model — `hi:true` renders in the green spotlight (KAT Coder Pro
   V2.5, our model); the rest are muted grey. Each bar wears its vendor logo
   (`logo` → key in LOGOS below). `dom` is a small muted domain suffix after the
   benchmark name. `meta` is the score-source label shown in the tooltip.
   `missing:true` renders a faded bar with an em-dash.

   Data: final comparison table across 6 编码类基准 (Coding / Claw / AA Coding
   Index). In the source table 粗体 = 该行最高分, 下划线 = 次高分. PinchBench 的
   Kimi K2.6 带 `*` 表示口径存疑/非直接可比，见 `meta`。GLM 5.1 在 PinchBench、
   无数据故 `missing:true`。 */
const TITLE    = "";
const SUBTITLE = "";
const NOTE     = "";

const PANELS = [
  {
    name: "SWE-Bench Pro", dom: "Coding", max: 75, ticks: [0, 38, 75],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:65.2, meta:"次高", hi:true},
      {label:"GLM 5.1",      logo:"zhipu",     value:58.4},
      {label:"GLM 5.2",      logo:"zhipu",     value:62.1},
      {label:"Kimi K2.6",    logo:"kimi",      value:58.6},
      {label:"Opus 4.8",     logo:"anthropic", value:69.2, meta:"最高"},
    ],
  },
  {
    name: "KAT Code Bench", dom: "Coding", max: 60, ticks: [0, 30, 60],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:53.1, meta:"次高", hi:true},
      {label:"GLM 5.1",      logo:"zhipu",     value:49.6},
      {label:"GLM 5.2",      logo:"zhipu",     value:50.3},
      {label:"Kimi K2.6",    logo:"kimi",      value:48.9},
      {label:"Opus 4.8",     logo:"anthropic", value:57.3, meta:"最高"},
    ],
  },
  {
    name: "PinchBench", dom: "Claw", max: 100, ticks: [0, 50, 100],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:94.9, meta:"最高 · Avg", hi:true},
      {label:"GLM 5.2",      logo:"zhipu",     value:87.0},
      {label:"Kimi K2.6",    logo:"kimi",      value:80.7,  meta:"* 口径存疑"},
      {label:"Opus 4.8",     logo:"anthropic", value:93.5, meta:"次高"},
    ],
  },
  {
    name: "KAT Claw Bench", dom: "Claw", max: 100, ticks: [0, 50, 100],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:85.5, hi:true},
      {label:"GLM 5.1",      logo:"zhipu",     value:84.4},
      {label:"GLM 5.2",      logo:"zhipu",     value:86.8, meta:"次高"},
      {label:"Kimi K2.6",    logo:"kimi",      value:85.2},
      {label:"Opus 4.8",     logo:"anthropic", value:90.7, meta:"最高"},
    ],
  },
  {
    name: "Terminal-Bench 2.1", dom: "AA Coding Index", max: 90, ticks: [0, 45, 90],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:60.7, hi:true},
      {label:"GLM 5.1",      logo:"zhipu",     value:61.8},
      {label:"GLM 5.2",      logo:"zhipu",     value:77.9,  meta:"次高"},
      {label:"Kimi K2.6",    logo:"kimi",      value:73.0},
      {label:"Opus 4.8",     logo:"anthropic", value:84.6,  meta:"最高"},
    ],
  },
  {
    name: "SciCode", dom: "AA Coding Index", max: 60, ticks: [0, 30, 60],
    bars: [
      {label:"KAT Pro V2.5", logo:"kat",      value:50.3, hi:true},
      {label:"GLM 5.1",      logo:"zhipu",     value:43.8},
      {label:"GLM 5.2",      logo:"zhipu",     value:50.5,  meta:"次高"},
      {label:"Kimi K2.6",    logo:"kimi",      value:53.5,  meta:"最高(并列)"},
      {label:"Opus 4.8",     logo:"anthropic", value:53.5,  meta:"最高(并列)"},
    ],
  },
];
/* ────────────────────────── end DATA ────────────────────────── */


/* ── logo registry (reusable reference data) ──────────────────────────────
   Each entry: viewBox + inner SVG markup. Monochrome logos (no fill attr)
   inherit `.blogo` fill and flip white on the highlighted bar. `kat` and
   `kimi` are from lobe-icons; `zhipu` / `anthropic` carried over. */
const LOGOS = {
  // KAT Coder V2.5 mark (from "KAT new logo.ai"). Wide 1.7:1, so it carries its own
  // badge size w/h. Black frame + green chevrons/slash on grey bars; CSS repaints the
  // whole mark white on the highlighted green bar.
  kat:{vb:"0 0 127.73 74.83",w:19,h:11.2,inner:'<path fill="#000" d="M31.008 32.516V12.992c0-1.219.988-2.207 2.207-2.207h61.031c1.219 0 2.203.988 2.203 2.207v19.524h10.789V12.992C107.238 5.828 101.41 0 94.246 0H33.215C26.051 0 20.223 5.828 20.223 12.992v19.524z"></path><path fill="#000" d="M96.449 42.145v19.523c0 1.219-.984 2.207-2.203 2.207H33.215c-1.219 0-2.207-.988-2.207-2.207V42.145H20.223v19.523c0 7.164 5.828 12.992 12.992 12.992h61.031c7.164 0 12.992-5.828 12.992-12.992V42.145z"></path><path fill="#489034" d="M42.863 31 .012 15.324v12.223l26.847 9.816L.012 47.184v12.222L42.863 43.742z"></path><path fill="#489034" d="M84.598 31l42.851-15.676v12.223l-26.848 9.816 26.848 9.821v12.222L84.598 43.742z"></path><path fill="#489034" d="M72.496 27.488H60.812l-5.847 19.266h11.683z"></path>'},
  kimi:{vb:"0 0 24 24",inner:'<path d="M21.846 0a1.923 1.923 0 110 3.846H20.15a.226.226 0 01-.227-.226V1.923C19.923.861 20.784 0 21.846 0z"></path><path d="M11.065 11.199l7.257-7.2c.137-.136.06-.41-.116-.41H14.3a.164.164 0 00-.117.051l-7.82 7.756c-.122.12-.302.013-.302-.179V3.82c0-.127-.083-.23-.185-.23H3.186c-.103 0-.186.103-.186.23V19.77c0 .128.083.23.186.23h2.69c.103 0 .186-.102.186-.23v-3.25c0-.069.025-.135.069-.178l2.424-2.406a.158.158 0 01.205-.023l6.484 4.772a7.677 7.677 0 003.453 1.283c.108.012.2-.095.2-.23v-3.06c0-.117-.07-.212-.164-.227a5.028 5.028 0 01-2.027-.807l-5.613-4.064c-.117-.078-.132-.279-.028-.381z"></path>'},
  zhipu:{vb:"0 0 24 24",inner:'<path d="M12.105 2L9.927 4.953H.653L2.83 2h9.276zM23.254 19.048L21.078 22h-9.242l2.174-2.952h9.244zM24 2L9.264 22H0L14.736 2H24z"></path>'},
  anthropic:{vb:"0 0 24 24",inner:'<path d="M4.709 15.955l4.72-2.647.08-.23-.08-.128H9.2l-.79-.048-2.698-.073-2.339-.097-2.266-.122-.571-.121L0 11.784l.055-.352.48-.321.686.06 1.52.103 2.278.158 1.652.097 2.449.255h.389l.055-.157-.134-.098-.103-.097-2.358-1.596-2.552-1.688-1.336-.972-.724-.491-.364-.462-.158-1.008.656-.722.881.06.225.061.893.686 1.908 1.476 2.491 1.833.365.304.145-.103.019-.073-.164-.274-1.355-2.446-1.446-2.49-.644-1.032-.17-.619a2.97 2.97 0 01-.104-.729L6.283.134 6.696 0l.996.134.42.364.62 1.414 1.002 2.229 1.555 3.03.456.898.243.832.091.255h.158V9.01l.128-1.706.237-2.095.23-2.695.08-.76.376-.91.747-.492.584.28.48.685-.067.444-.286 1.851-.559 2.903-.364 1.942h.212l.243-.242.985-1.306 1.652-2.064.73-.82.85-.904.547-.431h1.033l.76 1.129-.34 1.166-1.064 1.347-.881 1.142-1.264 1.7-.79 1.36.073.11.188-.02 2.856-.606 1.543-.28 1.841-.315.833.388.091.395-.328.807-1.969.486-2.309.462-3.439.813-.042.03.049.061 1.549.146.662.036h1.622l3.02.225.79.522.474.638-.079.485-1.215.62-1.64-.389-3.829-.91-1.312-.329h-.182v.11l1.093 1.068 2.006 1.81 2.509 2.33.127.578-.322.455-.34-.049-2.205-1.657-.851-.747-1.926-1.62h-.128v.17l.444.649 2.345 3.521.122 1.08-.17.353-.608.213-.668-.122-1.374-1.925-1.415-2.167-1.143-1.943-.14.08-.674 7.254-.316.37-.729.28-.607-.461-.322-.747.322-1.476.389-1.924.315-1.53.286-1.9.17-.632-.012-.042-.14.018-1.434 1.967-2.18 2.945-1.726 1.845-.414.164-.717-.37.067-.662.401-.589 2.388-3.036 1.44-1.882.93-1.086-.006-.158h-.055L4.132 18.56l-1.13.146-.487-.456.061-.746.231-.243 1.908-1.312-.006.006z" fill="#D97757" fill-rule="nonzero"></path>'},
};

const tip=document.getElementById("tip");
function showTip(html,e){tip.innerHTML=html;tip.style.opacity=1;moveTip(e);}
function moveTip(e){const pad=14;let x=e.clientX+pad,y=e.clientY+pad;const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth)x=e.clientX-r.width-pad;if(y+r.height>innerHeight)y=e.clientY-r.height-pad;
  tip.style.left=x+"px";tip.style.top=y+"px";}
function hideTip(){tip.style.opacity=0;}
const NS="http://www.w3.org/2000/svg";
const el=(n,a)=>{const x=document.createElementNS(NS,n);for(const k in a)x.setAttribute(k,a[k]);return x;};
const fmtShow=v=>v.toFixed(1);

let UID=0;
function renderPanel(p){
  const W=320,H=252,padL=26,padR=10,padT=26,padB=66;   // W:H sets the panel aspect
  const baseY=H-padB, topY=padT, plotH=baseY-topY;
  const max=p.max ?? Math.max(...p.bars.map(b=>b.value))*1.12;
  const ticks=p.ticks ?? [0,+(max/2).toFixed(0),+max.toFixed(0)];
  const y=v=>baseY-(v/max)*plotH;
  const n=p.bars.length, innerW=W-padL-padR, slot=innerW/n;
  const barW=Math.min(26,slot*0.56);
  const uid=++UID;

  const wrap=document.createElement("div");wrap.className="panel";
  const head=document.createElement("div");
  head.innerHTML=`<span class="panel-name">${p.name}</span>`+(p.dom?`<span class="panel-dom">${p.dom}</span>`:"");
  wrap.appendChild(head);

  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,width:"100%",style:"display:block;margin-top:8px;overflow:visible",
    role:"img","aria-label":p.name});
  const defs=el("defs",{});
  const gh=el("linearGradient",{id:`hl${uid}`,x1:0,y1:1,x2:0,y2:0});
  gh.appendChild(el("stop",{offset:"0%","stop-color":"var(--accent)"}));
  gh.appendChild(el("stop",{offset:"100%","stop-color":"var(--accent-deep)"}));
  const gg=el("linearGradient",{id:`gr${uid}`,x1:0,y1:1,x2:0,y2:0});
  gg.appendChild(el("stop",{offset:"0%","stop-color":"#d4d4d4"}));
  gg.appendChild(el("stop",{offset:"100%","stop-color":"#b3b3b3"}));
  defs.appendChild(gh);defs.appendChild(gg);svg.appendChild(defs);

  ticks.forEach(t=>{
    const gy=y(t);
    svg.appendChild(el("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"#e6e6e6","stroke-width":1,opacity:t===0?.9:.55}));
    const lab=el("text",{x:padL-6,y:gy+3.5,"text-anchor":"end","font-size":10,fill:"#9a9aa0"});
    lab.textContent=t;svg.appendChild(lab);
  });
  svg.appendChild(el("line",{x1:padL,x2:padL,y1:topY-4,y2:baseY,stroke:"#d8d8dc","stroke-width":1}));
  svg.appendChild(el("line",{x1:padL,x2:W-padR,y1:baseY,y2:baseY,stroke:"#c8c8ce","stroke-width":1}));

  p.bars.forEach((b,i)=>{
    const cx=padL+slot*(i+0.5);
    const ty=y(b.value), h=baseY-ty;
    const g=el("g",{class:"grp"+(b.hi?" bar-hl":"")});

    const rect=el("rect",{class:"barrect",x:cx-barW/2,y:baseY,width:barW,height:0,rx:3,
      fill:`url(#${b.hi?"hl":"gr"}${uid})`,opacity:b.missing?.4:1});
    g.appendChild(rect);
    if(!b.missing) requestAnimationFrame(()=>requestAnimationFrame(()=>{rect.setAttribute("y",ty);rect.setAttribute("height",Math.max(0,h));}));

    const sc=el("text",{x:cx,y:(b.missing?baseY-6:ty-7),"text-anchor":"middle","font-size":11,"font-family":"var(--mono)",
      "font-weight":b.hi?700:600,fill:b.hi?"var(--accent-deep)":"#6b7280"});
    sc.textContent=b.missing?"—":fmtShow(b.value);g.appendChild(sc);

    if(!b.missing){
      const L=LOGOS[b.logo], ly=ty+5;
      if(L){
        const lw=L.w??12, lh=L.h??12;
        const lg=el("svg",{class:"blogo",x:cx-lw/2,y:ly,width:lw,height:lh,viewBox:L.vb});
        lg.innerHTML=L.inner;g.appendChild(lg);
      }else{
        const fl=el("text",{x:cx,y:ly+12,"text-anchor":"middle","font-size":11,"font-weight":700,
          fill:b.hi?"#fff":"#6b7280"});
        fl.textContent=(b.label||"?").trim()[0];g.appendChild(fl);
      }
    }

    const lx=cx, lyb=baseY+9;
    const t=el("text",{x:lx,y:lyb,"text-anchor":"end","font-size":9,
      "font-weight":b.hi?700:500,fill:b.hi?"var(--accent)":"#5b6270",
      transform:`rotate(-45 ${lx} ${lyb})`});
    t.textContent=b.label;g.appendChild(t);

    const hit=el("rect",{x:cx-slot/2,y:topY-6,width:slot,height:plotH+10,fill:"transparent"});
    const tipHtml=`<div class="t-cat">${b.label} · ${p.name}</div><b>${b.missing?"—":fmtShow(b.value)}</b>`+
      (b.meta?` <span class="t-dim">· ${b.meta}</span>`:"");
    hit.addEventListener("mousemove",e=>showTip(tipHtml,e));
    hit.addEventListener("mouseleave",hideTip);g.appendChild(hit);

    svg.appendChild(g);
  });

  wrap.appendChild(svg);
  return wrap;
}

document.getElementById("title").textContent=TITLE;
const sub=document.getElementById("subtitle");if(SUBTITLE)sub.textContent=SUBTITLE;else sub.style.display="none";
const note=document.getElementById("note");if(NOTE)note.textContent=NOTE;else note.style.display="none";
const host=document.getElementById("grid");
PANELS.forEach(p=>host.appendChild(renderPanel(p)));
addEventListener("scroll",hideTip,true);
</script>
</body>
</html>
